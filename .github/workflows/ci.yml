name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Latest Go minor plus the previous two. Bump this list when a new Go minor is
  # released; the go.mod `go` directive is the supported floor and stays lower
  # than the oldest entry here. Each matrix entry reports its own status context
  # ("unit + vet (go 1.27)", ...), so main's required checks must be updated to
  # match whenever this list changes.
  test:
    name: unit + vet (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: make test (go vet + go test ./...)
        run: make test

  parity:
    name: parity (corpus + exhaustive sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Parity compares Go output against the Ruby gem, so the Go toolchain
      # version is not what is under test: pin the latest matrix entry only.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: parity
      # Runs the curated corpus plus the full 1970-2050 exhaustive sweep against
      # the holidays gem pinned by parity/Gemfile.lock. Blocking on every PR/push
      # per project decision; the -timeout=20m (in the Makefile parity target)
      # covers shared runners being slower than a local box.
      - name: make parity (Ruby oracle vs Go, full sweep)
        run: make parity
